<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kelola Sales — TGOFresh</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#1a4d2e;--g2:#2d7a4f;--gl:#e8f5e9;--bg:#f4f7f4;--card:#fff;--bd:#dfe7df;--ink:#1a2419;--ink2:#6b7a6b;--r1:#c0392b;--y1:#d68910}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
.mono{font-family:'JetBrains Mono',monospace}
.hidden{display:none!important}
.appbar{background:#fff;color:var(--g1);padding:.8rem 1rem;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.appbar .ttl{font-weight:800;font-size:1.05rem}
.appbar button{background:var(--gl);color:var(--g1);border:1px solid var(--bd);border-radius:8px;padding:.4rem .7rem;font-size:.75rem;font-weight:600;font-family:inherit}
.wrap{padding:1rem;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1.1rem;margin-bottom:1rem}
.card h2{font-size:1rem;color:var(--g1);margin-bottom:.9rem}
label{display:block;font-size:.74rem;font-weight:600;color:var(--ink2);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.02em}
input{width:100%;padding:.75rem;border:1px solid var(--bd);border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--g2)}
.btn{width:100%;padding:.9rem;border:none;border-radius:12px;font-size:1rem;font-weight:700;font-family:inherit;color:#fff;background:var(--g1);margin-top:.9rem}
.btn:active{background:var(--g2)}
.btn.small{width:auto;padding:.45rem .7rem;font-size:.78rem;margin:0}
.btn.danger{background:#fff;color:var(--r1);border:1.5px solid var(--r1)}
/* Login */
.login-box{max-width:320px;margin:3rem auto;text-align:center;padding:1rem}
.login-box .logo img{height:100px;width:auto;margin-bottom:.75rem}
.login-box h1{font-size:1.2rem;color:var(--g1);margin-bottom:.3rem}
.login-box p{color:var(--ink2);font-size:.85rem;margin-bottom:1.3rem}
.pin-display{font-size:1.8rem;letter-spacing:.5rem;height:2.6rem;margin-bottom:1rem;color:var(--g1);font-weight:700}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.pinpad button{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:1rem;font-size:1.3rem;font-weight:700;color:var(--ink);font-family:inherit}
.pinpad button:active{background:var(--gl)}
/* Sales list */
.sale{display:flex;align-items:center;justify-content:space-between;padding:.7rem;border:1px solid var(--bd);border-radius:10px;margin-bottom:.6rem;background:#fff}
.sale .info .nm{font-weight:700}
.sale .info .pn{font-size:.8rem;color:var(--ink2);margin-top:.1rem}
.sale .pin-badge{font-family:'JetBrains Mono',monospace;font-weight:700;background:var(--gl);color:var(--g1);padding:.2rem .5rem;border-radius:6px;letter-spacing:.1rem}
.empty{text-align:center;padding:2rem 1rem;color:var(--ink2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.8rem 1.2rem;border-radius:12px;font-size:.85rem;font-weight:600;z-index:50;max-width:90%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.ok{background:var(--g2)}.toast.err{background:var(--r1)}.toast.warn{background:var(--y1)}
/* PIN baru popup */
.pinnew{background:var(--gl);border:2px solid var(--g2);border-radius:12px;padding:1rem;text-align:center;margin-top:.9rem}
.pinnew .big{font-family:'JetBrains Mono',monospace;font-size:2.2rem;font-weight:700;color:var(--g1);letter-spacing:.3rem}
.pinnew .cap{font-size:.78rem;color:var(--ink2);margin-top:.3rem}
</style>
</head>

    <h1>Kelola Sales</h1>
    <p>Masukkan PIN Owner/Admin</p>
    <div class="pin-display mono" id="pinDisplay"></div>
    <div class="pinpad">
      <button onclick="pin('1')">1</button><button onclick="pin('2')">2</button><button onclick="pin('3')">3</button>
      <button onclick="pin('4')">4</button><button onclick="pin('5')">5</button><button onclick="pin('6')">6</button>
      <button onclick="pin('7')">7</button><button onclick="pin('8')">8</button><button onclick="pin('9')">9</button>
      <button onclick="pinClear()">✕</button><button onclick="pin('0')">0</button><button onclick="pinDel()">⌫</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="appbar">
    <div class="ttl">👥 Kelola Sales</div>
    <button onclick="logout()">Keluar</button>
  </div>
  <div class="wrap">

    <div class="card">
      <h2>➕ Tambah Sales Baru</h2>
      <label>Nama Sales</label>
      <input id="newNama" placeholder="mis. Budi Santoso" autocomplete="off">
      <button class="btn" onclick="addSales()">Buat Sales & PIN</button>
      <div id="pinNewBox"></div>
    </div>

    <div class="card">
      <h2>📋 Daftar Sales Aktif</h2>
      <div id="salesList"><div class="empty">Memuat...</div></div>
    </div>

  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzRCJ9dU7FITGKY3u-6hKW0aGGGeV0DemXYC2X-MdzaIgQemZ2oYYWPbYxMg0RLZIQ/exec';

// PIN Owner/Admin untuk membuka halaman ini (bukan PIN sales).
// Rita ganti sesuai keinginan. Default: 3333 (Owner), 4545 (Admin).
const ADMIN_PIN = { '3333':'Owner', '4545':'Admin' };

let pinBuf='';
function pin(d){ if(pinBuf.length<6){ pinBuf+=d; renderPin(); if(ADMIN_PIN[pinBuf]) openApp(); } }
function pinDel(){ pinBuf=pinBuf.slice(0,-1); renderPin(); }
function pinClear(){ pinBuf=''; renderPin(); }
function renderPin(){ document.getElementById('pinDisplay').textContent='•'.repeat(pinBuf.length); }
function openApp(){
  pinBuf='';
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadSales();
}
function logout(){
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  renderPin();
  document.getElementById('pinNewBox').innerHTML='';
}

async function gasPost(body, timeoutMs=20000){
  const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),timeoutMs);
  try{
    const res=await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctrl.signal});
    clearTimeout(t); return await res.json();
  }catch(e){ clearTimeout(t); throw e; }
}

async function loadSales(){
  const box=document.getElementById('salesList');
  box.innerHTML='<div class="empty">Memuat...</div>';
  try{
    const r=await gasPost({type:'sales_list'});
    const list=(r.sales||[]);
    if(!list.length){ box.innerHTML='<div class="empty">Belum ada sales</div>'; return; }
    box.innerHTML='';
    list.forEach(s=>{
      box.innerHTML+=`
        <div class="sale">
          <div class="info">
            <div class="nm">${s.nama}</div>
            <div class="pn">PIN akses aplikasi lapangan</div>
          </div>
          <div style="display:flex;align-items:center;gap:.6rem">
            <span class="pin-badge">${s.pin}</span>
            <button class="btn small danger" onclick="delSales('${s.pin}','${s.nama.replace(/'/g,"")}')">Hapus</button>
          </div>
        </div>`;
    });
  }catch(e){ box.innerHTML='<div class="empty">Gagal memuat. Cek koneksi.</div>'; }
}

let _adding=false;
async function addSales(){
  if(_adding) return;
  const nama=document.getElementById('newNama').value.trim();
  if(!nama){ toast('Isi nama sales','warn'); return; }
  _adding=true; toast('⏳ Membuat...');
  try{
    const r=await gasPost({type:'sales_add', nama:nama});
    if(r && r.ok){
      document.getElementById('newNama').value='';
      document.getElementById('pinNewBox').innerHTML=`
        <div class="pinnew">
          <div class="cap">PIN untuk <b>${r.nama}</b> — berikan ke sales ini:</div>
          <div class="big">${r.pin}</div>
          <div class="cap">Sales login di aplikasi lapangan pakai PIN ini</div>
        </div>`;
      toast('✅ Sales dibuat','ok');
      loadSales();
    } else { toast('⚠️ '+((r&&r.msg)||'Gagal'),'err'); }
  }catch(e){ toast('⚠️ Gagal, cek koneksi','err'); }
  finally{ _adding=false; }
}

async function delSales(pin, nama){
  if(!confirm('Hapus sales "'+nama+'" dari daftar?\n\nAkses login PIN ini akan dicabut. Transaksi lama sales ini TETAP tersimpan di data.')) return;
  toast('⏳ Menghapus...');
  try{
    const r=await gasPost({type:'sales_delete', pin:pin});
    if(r && r.ok){ toast('✅ Dihapus','ok'); loadSales(); }
    else toast('⚠️ '+((r&&r.msg)||'Gagal'),'err');
  }catch(e){ toast('⚠️ Gagal, cek koneksi','err'); }
}

let _toastT=null;
function toast(msg,type=''){
  let el=document.querySelector('.toast'); if(el) el.remove();
  el=document.createElement('div'); el.className='toast '+type; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(_toastT); _toastT=setTimeout(()=>el.remove(), type==='err'?4500:2500);
}
</script>
</body>
</html>
